version: 2

project_name: baseten

before:
  hooks:
    - go mod tidy

builds:
  - id: baseten
    main: ./cmd/baseten
    binary: baseten
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/basetenlabs/baseten-cli/internal/cmd.Version={{.Version}}

archives:
  - id: baseten
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: basetenlabs
    name: baseten-cli
  draft: false
  prerelease: auto
  # Keep the title of the existing release, which the release workflow
  # validated, instead of overwriting it with the tag.
  name_template: '{{ envOrDefault "RELEASE_TITLE" .Tag }}'

# Publishes Formula/baseten.rb to the basetenlabs/homebrew-baseten tap on each
# stable release, and Formula/baseten-rc.rb on every release including RCs.
# Both install the `baseten` binary, so they conflict. Uses the deprecated
# `brews` (formula) rather than `homebrew_casks` because the formula installs
# on both macOS and Linuxbrew.
brews:
  - name: baseten
    repository:
      owner: basetenlabs
      name: homebrew-baseten
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/basetenlabs/baseten-cli"
    description: "CLI for Baseten"
    license: MIT
    skip_upload: auto
    conflicts:
      - baseten-rc
    test: |
      system "#{bin}/baseten", "--version"
  - name: baseten-rc
    repository:
      owner: basetenlabs
      name: homebrew-baseten
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/basetenlabs/baseten-cli"
    description: "CLI for Baseten, including unstable release candidates"
    license: MIT
    skip_upload: false
    conflicts:
      - baseten
    test: |
      system "#{bin}/baseten", "--version"

