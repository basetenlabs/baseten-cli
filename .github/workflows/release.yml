name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Fail before building anything unless the tag, the prerelease checkbox,
      # and the title agree, so an RC never becomes "Latest" or updates the
      # stable formula.
      - name: Check the release matches the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! RELEASE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,name); then
            echo "No GitHub release for $TAG. Create the release in GitHub, which creates the tag, instead of pushing a tag."
            exit 1
          fi
          IS_PRERELEASE=$(jq -r .isPrerelease <<<"$RELEASE")
          NAME=$(jq -r .name <<<"$RELEASE")
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            if [[ "$IS_PRERELEASE" != true || "$NAME" != "[UNSTABLE] $TAG"* ]]; then
              echo "$TAG is a prerelease tag, so the release must be marked as a pre-release with a title starting with \"[UNSTABLE] $TAG\"."
              exit 1
            fi
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [[ "$IS_PRERELEASE" == true || "$NAME" != "$TAG" ]]; then
              echo "$TAG is a stable tag, so the release must not be marked as a pre-release and must be titled \"$TAG\"."
              exit 1
            fi
          else
            echo "$TAG is not a vX.Y.Z or vX.Y.Z-rc.N tag."
            exit 1
          fi
          # GoReleaser sets the release title from release.name_template,
          # which keeps this one.
          echo "RELEASE_TITLE=$NAME" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate a token scoped to homebrew-baseten
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_HOMEBREW_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.APP_HOMEBREW_UPDATER_PRIVATE_KEY }}
          owner: basetenlabs
          repositories: homebrew-baseten
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Open a README version-bump pull request
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin main
          git checkout --quiet -B "readme-$TAG" origin/main
          sed -i "s|releases/download/v[0-9][0-9.]*/baseten_[0-9][0-9.]*_|releases/download/$TAG/baseten_${VERSION}_|g" README.md
          if git diff --quiet README.md; then
            echo "README already references $TAG"
            exit 0
          fi
          git add README.md
          git commit -m "Point the README install links at $TAG"
          git push origin "HEAD:readme-$TAG"
          gh pr create --title "Point the README install links at $TAG"             --body "Automated follow-up to the $TAG release: the release-verification CI check fails on every PR until the README references the newest release."             --reviewer "${GITHUB_TRIGGERING_ACTOR}"
