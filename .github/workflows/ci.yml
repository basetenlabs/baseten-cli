name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        run: |
          go mod tidy
          go fmt ./...
          git diff --exit-code

      # The harness tests run the installed Claude Code, Codex, and OpenCode
      # CLIs against a local gateway, and skip any that are missing. Harness
      # setup is only supported on macOS and Linux so far.
      - uses: actions/setup-node@v4
        if: matrix.os != 'windows-latest'
        with:
          node-version: 22

      - name: Install harnesses
        if: matrix.os != 'windows-latest'
        run: npm install -g @anthropic-ai/claude-code @openai/codex opencode-ai

      - name: Test
        run: go test ./...

      - name: Verify README references the latest release
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if ! grep -qF "releases/download/$TAG/" README.md; then
            echo "README.md install instructions do not reference latest release $TAG; please update them."
            exit 1
          fi

      # Job submission invokes Truss through `uv tool run`.
      - name: Install uv
        if: matrix.os == 'ubuntu-latest'
        uses: astral-sh/setup-uv@v5

      - name: Loops exec E2E test
        if: matrix.os == 'ubuntu-latest' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BASETEN_E2E_TEST_API_KEY: ${{ secrets.BASETEN_E2E_TEST_API_KEY }}
          BASETEN_E2E_TEST_REMOTE_URL: ${{ secrets.BASETEN_E2E_TEST_REMOTE_URL }}
        run: |
          if [[ -z "$BASETEN_E2E_TEST_API_KEY" || -z "$BASETEN_E2E_TEST_REMOTE_URL" ]]; then
            echo "Missing E2E credentials for a trusted CI run."
            exit 1
          fi
          go test -v -tags=e2e -run '^TestE2ELoopsExec$' -count=1 -timeout 25m ./internal/e2e-tests/...

      - name: E2E test
        if: matrix.os == 'ubuntu-latest'
        env:
          # Forks won't have these secrets so e2e tests skip, but pushes
          # to main will run them.
          BASETEN_E2E_TEST_API_KEY: ${{ secrets.BASETEN_E2E_TEST_API_KEY }}
          BASETEN_E2E_TEST_REMOTE_URL: ${{ secrets.BASETEN_E2E_TEST_REMOTE_URL }}
        # Stream test progress to make stalled live runs identifiable.
        run: go test -v -tags=e2e -skip '^TestE2ELoopsExec$' -timeout 30m ./internal/e2e-tests/...
