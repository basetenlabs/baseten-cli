name: Harness e2e (latest)

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  harness-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install harnesses
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex opencode-ai @earendil-works/pi-coding-agent
          npm install -g --prefix "$RUNNER_TEMP/opencode2" @opencode/cli
          echo "BASETEN_TEST_OPENCODE2=$RUNNER_TEMP/opencode2/bin/opencode" >> "$GITHUB_ENV"

      - name: Harness e2e test
        env:
          BASETEN_E2E_TEST_API_KEY: ${{ secrets.BASETEN_E2E_TEST_API_KEY }}
          BASETEN_E2E_TEST_REMOTE_URL: ${{ secrets.BASETEN_E2E_TEST_REMOTE_URL }}
        run: go -C internal/e2e-tests test -v -tags=e2e -timeout 40m -parallel 16 -run '^TestE2EHarness' ./...
